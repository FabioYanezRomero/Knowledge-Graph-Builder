name: legal-ollama
description: Full pipeline for legal domain using Ollama (local)

client:
  type: ollama
  model: gemma3:1b
  temperature: 0.0
  timeout: 300
  base_url: http://localhost:11434
  workers: 1               # serialize: parallel local generations wedge the backend
  think: false             # disable reasoning phase (faster, honored by the native provider)

domain: legal
mode: open

input:
  file: data/legal/legal_background.jsonl
  text_field: text
  id_field: id

output_dir: outputs/pipeline_run_ollama

# Steps run with the default client above unless they declare their own
# `client:` block, which overrides only the listed fields — e.g. a cheap
# model for high-volume extraction and a stronger one for augmentation:
#
#   - extract:
#       client:
#         model: gemma3:1b
#   - augment:
#       client:
#         model: gemma3:27b
#       max_disconnected: 1
#
# `consolidate` (entity_resolution by default) merges/cleans triples without
# adding knowledge; it can run after extract and/or after augment:
#
#   - extract
#   - consolidate
#   - augment
#   - consolidate: {strategy: entity_resolution}
steps:
  - extract
  - consolidate            # entity_resolution: merge entity name variants (adds no triples)
  - augment:
      max_disconnected: 3   # don't force one component; forcing it fabricates hub/filler edges
      max_iterations: 3
  - export-json
  - convert
  - visualize-network:
      layout: spring
  - visualize-extraction:
      group_by: entity_type
